# Merge with compose.yaml on a dedicated Ubuntu VM. Windows services stay intact.
services:
  backend:
    profiles: [container-backend-unused]
  n8n:
    networks: !reset []
    ports: !reset []
    network_mode: host
    environment:
      DB_POSTGRESDB_HOST: 127.0.0.1
      DB_POSTGRESDB_PORT: ${DB_PORT:-55432}
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_TEMPLATES_ENABLED: "false"
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
    volumes:
      - ./workflows:/project-workflows:ro
